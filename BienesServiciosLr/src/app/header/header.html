      <li>
        <a routerLink="/" routerLinkActive="active" routerLinkActiveOptions="{ exact: true }">

        </a>
      </li>
      <li>

      </li>
      <li>
        <a routerLink="/nosotros" routerLinkActive="active"> Quiénes somos </a>
      </li>
    </ul>

    <!-- CTA desktop -->
    <div class="nav-cta-wrap">
      <button class="nav-cta" type="button">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2.5"

          />

      </button>

    <!-- Hamburger -->
    <button
      class="nav-burger"
      [class.open]="menuOpen"
      (click)="toggleMenu()"
      type="button"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Menú móvil -->
  <div class="nav-mobile" *ngIf="menuOpen">
    <a routerLink="/" (click)="toggleMenu()">Inicio</a>
    <a routerLink="/labores" (click)="toggleMenu()">¿Qué hacemos?</a>

        <path

          3.94 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1
          -.45 2.11L8.09 8.91a16 16 0 0 0 5.61 5.61l1.27-1.27a2 2 0 0 1
