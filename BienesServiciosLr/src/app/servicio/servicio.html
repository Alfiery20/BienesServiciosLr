<section class="srv-section">
  <div class="srv-inner">
    <!-- Botón regresar -->
    <div class="srv-back">
      <button class="srv-back-btn" type="button" routerLink="/labores">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6" />
        </svg>
        Regresar
      </button>
    </div>
    <!-- Header -->
    <div class="srv-header">
      <div class="srv-label-wrap">
        <span class="srv-label">
          <span class="srv-label-dot"></span>
          Nuestros servicios
        </span>
      </div>
      <h2 class="srv-title">
        Servicio de <span class="srv-title-accent">{{ seleccionado.titulo }}</span>
      </h2>
      <p class="srv-desc">{{ seleccionado.descripcion }}</p>
    </div>

    <!-- Video -->
    <div class="srv-video-wrap">
      <video class="srv-video" controls>
        <source [src]="seleccionado.video" type="video/mp4" />
      </video>
    </div>

    <!-- Beneficios -->
    <div class="srv-benefits-label">
      <h3>¿Por qué elegirnos?</h3>
      <p class="srv-benefits-sub">Beneficios diseñados para tu crecimiento</p>
    </div>

    <div class="srv-grid">
      <div
        class="srv-card"
        *ngFor="let beneficio of seleccionado.beneficios; let i = index"
        [style.animation-delay]="i * 0.1 + 's'"
      >
        <div class="srv-card-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#6BCB3D"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <p>{{ beneficio }}</p>
      </div>
    </div>

    <!-- CTA -->
    <div class="srv-cta">
      <button class="srv-cta-btn" type="button" (click)="enviarMensaje()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2.5"
          stroke-linecap="round"
        >
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07
            A19.5 19.5 0 0 1 4.99 12 19.79 19.79 0 0 1 1.97 3.18 2 2 0 0 1 3.94
            1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45
            2.11L8.09 8.91a16 16 0 0 0 5.61 5.61l1.27-1.27a2 2 0 0 1
            2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
          />
        </svg>
        Hablar con un asesor
      </button>
      <p class="srv-cta-sub">Sin compromiso · Respuesta en menos de 24 h</p>
    </div>
  </div>
</section>
